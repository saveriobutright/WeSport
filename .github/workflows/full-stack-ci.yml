name: Full-stack CI

on:
  push:
    branches:
      - main
      - repository-polish
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/wesport-backend/pom.xml

      - name: Start PostgreSQL and Keycloak
        run: docker compose -f docker/docker-compose.yml up -d --wait

      - name: Wait for Keycloak
        run: |
          for attempt in {1..60}; do
            if curl --silent --fail \
              http://localhost:8080/realms/wesport/.well-known/openid-configuration \
              > /dev/null; then
              echo "Keycloak is ready"
              exit 0
            fi

            sleep 2
          done

          echo "Keycloak did not become ready"
          docker compose -f docker/docker-compose.yml logs keycloak
          exit 1

      - name: Run backend tests
        working-directory: backend/wesport-backend
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode test

      - name: Show service logs on failure
        if: failure()
        run: docker compose -f docker/docker-compose.yml logs

      - name: Stop services
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Build frontend
        working-directory: frontend
        run: npm run build