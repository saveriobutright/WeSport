server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: wesport-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wesport}
    username: ${DB_USERNAME:wesport}
    password: ${DB_PASSWORD:wesport}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/wesport}

logging:
  level:
    org.flywaydb: INFO